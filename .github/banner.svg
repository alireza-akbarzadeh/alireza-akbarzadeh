<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Alireza Akbarzadeh — Senior Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d1c"/>
      <stop offset="60%" stop-color="#0e1124"/>
      <stop offset="100%" stop-color="#161a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBACF9"/>
      <stop offset="100%" stop-color="#7C6BF5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#CBACF9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#CBACF9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="4" height="300" fill="url(#accent)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="96" fill="#CBACF9" font-size="15" letter-spacing="5.5" font-weight="600">SENIOR FRONTEND ENGINEER</text>
    <text x="70" y="164" fill="#ffffff" font-size="58" font-weight="700" letter-spacing="-1">Alireza Akbarzadeh</text>
    <text x="72" y="208" fill="#BEC1DD" font-size="21">Frontend architecture · design systems · performance</text>
    <text x="72" y="248" fill="#6f739a" font-size="16">React · Next.js · TypeScript · Vue / Nuxt — Tehran, working remote</text>
  </g>

  <g opacity="0.5" stroke="url(#accent)" fill="none" stroke-width="1.5">
    <rect x="1000" y="74" width="86" height="60" rx="8"/>
    <rect x="1100" y="74" width="110" height="60" rx="8"/>
    <rect x="1000" y="146" width="210" height="34" rx="8"/>
    <rect x="1000" y="192" width="128" height="34" rx="8"/>
    <path d="M1086 104 h14" stroke-opacity="0.8"/>
    <path d="M1128 163 h0" stroke-opacity="0.8"/>
  </g>
</svg>
